name: lucid_drift
description: Sleep affirmations and lucid dreaming trigger engine
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  flutter_bloc: ^8.1.5
  get_it: ^7.7.0

  # Navigation
  go_router: ^13.2.0

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2

  # Audio recording
  record: ^6.0.0

  # Audio playback
  just_audio: ^0.9.39
  audio_session: ^0.1.21

  # Background service & notifications
  flutter_background_service: ^5.0.5
  workmanager: ^0.9.0
  flutter_local_notifications: ^17.1.2

  # Vibration (MILD trigger)
  vibration: ^2.0.0

  # Timezone (для планирования уведомлений)
  timezone: ^0.9.4

  # Utils
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  freezed: ^2.5.2
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
